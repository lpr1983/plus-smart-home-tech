server.port=0

spring.application.name=order-service
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/order_db
spring.datasource.username=dbuser
spring.datasource.password=12345

spring.cloud.openfeign.client.config.default.connectTimeout=1000
spring.cloud.openfeign.client.config.default.readTimeout=2000
spring.cloud.openfeign.client.config.product-service.connectTimeout=1000
spring.cloud.openfeign.client.config.product-service.readTimeout=2000
spring.cloud.openfeign.client.config.inventory-service.connectTimeout=1000
spring.cloud.openfeign.client.config.inventory-service.readTimeout=2000
