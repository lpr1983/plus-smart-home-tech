spring:
  application:
    name: order-service
  config:
    import: "configserver:"
  cloud:
    config:
      fail-fast: true
      retry:
        useRandomPolicy: true
        max-interval: 6000
      discovery:
        enabled: true
        serviceId: config-server
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 2000
          product-service:
            connectTimeout: 1000
            readTimeout: 2000
          inventory-service:
            connectTimeout: 1000
            readTimeout: 2000

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
